<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPod Feel Simulator 3D</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 3D WebGL Canvas -->
  <div id="canvas-container"></div>

  <!-- YouTube Style "Wear Headphones" Immersive Audio Popup -->
  <div id="immersive-modal" class="immersive-modal">
    <div class="immersive-card">
      <div class="headphone-visual">
        <span class="wave wave-l">((</span>
        <div class="headphone-icon">🎧</div>
        <span class="wave wave-r">))</span>
      </div>
      <h2 class="immersive-heading">Wear Headphones</h2>
      <p class="immersive-subtext">For the best immersive 3D audio experience, put on your headphones.</p>
      <button id="immersive-btn" class="immersive-btn">Feel It 🎧</button>
    </div>
  </div>

  <!-- Loading Screen -->
  <div id="loader-overlay">
    <div class="spinner"></div>
    <div class="loader-text" id="loader-status">Loading iPod Feel Simulator 3D...</div>
  </div>

  <!-- Minimal Toast Notification -->
  <div id="toast" class="toast-pill"></div>

  <!-- Hidden File Input for MP3 Import (Supports Multiple Files) -->
  <input type="file" id="mp3-file-input" accept="audio/*" multiple style="display: none;" />

  <!-- Main JavaScript Entrypoint -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
