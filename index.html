<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Feel iPod</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 3D WebGL Canvas (Pure iPod Experience) -->
  <div id="canvas-container"></div>

  <!-- Loading Screen -->
  <div id="loader-overlay">
    <div class="spinner"></div>
    <div class="loader-text" id="loader-status">Loading iPod...</div>
  </div>

  <!-- Minimal Drag & Drop Notification -->
  <div id="toast" class="toast-pill"></div>

  <!-- Hidden File Input for Audio Drop/Import -->
  <input type="file" id="mp3-file-input" accept="audio/*" style="display: none;" />

  <!-- Nostalgic Welcome Screen -->
  <div id="welcome-screen" class="welcome-overlay">
    <div class="welcome-content">
      <div class="welcome-badge"> Retro Experience</div>
      <h1 class="welcome-title">Let's feel the iPod nostalgic</h1>
      <p class="welcome-subtitle">
        Touch the iconic click wheel, browse the classic LCD screen, and relive the tactile magic.
      </p>
      
      <div class="welcome-buttons">
        <button id="btn-feel-it" class="btn-welcome primary">
          <span>✨</span> Feel It
        </button>
      </div>
    </div>
  </div>

  <!-- Main JavaScript Entrypoint -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
