<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPod Classic</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 3D WebGL Canvas -->
  <div id="canvas-container"></div>

  <!-- Loading Screen -->
  <div id="loader-overlay">
    <div class="spinner"></div>
    <div class="loader-text" id="loader-status">Loading iPod...</div>
  </div>

  <!-- Minimal Toast Notification -->
  <div id="toast" class="toast-pill"></div>

  <!-- Hidden File Input for MP3 Import -->
  <input type="file" id="mp3-file-input" accept="audio/*" style="display: none;" />

  <!-- Main JavaScript Entrypoint -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
