<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <!-- Outer Wheel Ring -->
  <circle cx="32" cy="32" r="24" stroke="url(#podGrad)" stroke-width="3" stroke-opacity="0.9"/>
  <!-- Click Wheel Track -->
  <circle cx="32" cy="32" r="17" fill="url(#wheelGrad)" fill-opacity="0.25" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Center Action Button -->
  <circle cx="32" cy="32" r="8" fill="url(#podGrad)"/>
  <!-- Acoustic Wave Accents -->
  <path d="M49 15C53.5 19.5 56 25.5 56 32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
